<span class="badge-pf badge-pf--period badge-pf--period-stack" *ngIf="rango">
  <i class="bi bi-calendar3" aria-hidden="true"></i>
  <span class="badge-pf__period-text">
    <span class="badge-pf__period-range">{{ rango }}</span>
    <span class="badge-pf__period-duration" *ngIf="duracion">{{ duracion }}</span>
  </span>
</span>
