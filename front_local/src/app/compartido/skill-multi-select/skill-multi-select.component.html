<div
  class="skill-multi-select"
  role="group"
  aria-label="Habilidades por tipo"
  [style.--skill-cols]="groups.length"
>
  <div class="skill-multi-select__scroll">
    <table *ngIf="groups.length > 0" class="skill-multi-select__table">
    <thead>
      <tr>
        <th
          *ngFor="let group of groups; trackBy: trackByTipoId"
          scope="col"
          class="skill-multi-select__th"
        >
          {{ group.nombre }}
        </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of rowIndexes; trackBy: trackByRow">
        <td
          *ngFor="let group of groups; trackBy: trackByTipoId"
          class="skill-multi-select__td"
        >
          <ng-container *ngIf="skillAt(group, row) as h">
            <label
              class="skill-multi-select__cell"
              [class.skill-multi-select__cell--selected]="isSelected(h.id)"
              [for]="'skill-ms-' + h.id"
            >
              <input
                class="skill-multi-select__checkbox"
                type="checkbox"
                [id]="'skill-ms-' + h.id"
                [checked]="isSelected(h.id)"
                (change)="toggle(h.id, $any($event.target).checked)"
              />
              <span class="skill-multi-select__label">{{ h.nombre }}</span>
            </label>
          </ng-container>
        </td>
      </tr>
    </tbody>
    </table>
  </div>

  <p *ngIf="options.length === 0" class="skill-multi-select__empty">
    No hay habilidades disponibles.
  </p>
</div>
