<section id="experiencia" class="section section--alt">
  <div class="section__header">
    <h2 class="section__title">Experiencia Laboral</h2>
    <button
      type="button"
      class="btn-pf btn-pf--add"
      (click)="openForm('create')"
      *ngIf="isAdmin"
      data-tip="Agregar experiencia"
      data-tip-align="end"
      aria-label="Agregar experiencia"
    >
      <i class="bi bi-plus-lg"></i>
    </button>
  </div>

  <div class="exp-carousel" *ngIf="expe.length > 0">
    <div class="exp-carousel__wrapper">
      <button
        type="button"
        class="exp-carousel__nav exp-carousel__nav--prev"
        *ngIf="showNav"
        [disabled]="!canGoPrev"
        (click)="prevPage()"
        aria-label="Experiencia anterior"
      >
        <i class="bi bi-chevron-left" aria-hidden="true"></i>
      </button>

      <div
        #carousel
        class="exp-carousel__viewport"
        [style.height.px]="viewportHeight"
        tabindex="0"
        role="region"
        aria-label="Carrusel de experiencia laboral"
        aria-live="polite"
      >
        <div
          class="exp-carousel__track"
          [style.--total-pages]="totalPages"
          [style.transform]="trackTransform"
        >
          <div
            #carouselPage
            class="exp-carousel__page"
            [class.exp-carousel__page--desktop]="isDesktop"
            *ngFor="let page of pages; let pageIndex = index"
            [attr.aria-hidden]="pageIndex !== currentPage"
          >
            <article
              class="card-portfolio exp-card"
              [ngClass]="getCardCategoryClass(exp)"
              *ngFor="let exp of page"
            >
              <div class="card-portfolio__body exp-card__body">
                <header class="exp-card__header">
                  <div class="exp-card__org" *ngIf="exp.organizacion">
                    <app-org-badge
                      [organizacion]="exp.organizacion"
                      [tipoUbicacion]="exp.tipoUbicacion?.nombre || null"
                      size="md"
                    ></app-org-badge>
                  </div>

                  <div class="exp-card__meta-box" aria-label="Período">
                    <app-periodo-display
                      [fechaInicio]="exp.fechaInicio"
                      [fechaFin]="exp.fechaFin"
                      [esActual]="exp.esActual"
                    ></app-periodo-display>
                  </div>
                </header>

                <div class="exp-card__main">
                  <div class="exp-card__desc">
                    <h3 class="card-portfolio__title exp-card__title">{{ exp.nombreE }}</h3>

                    <div
                      class="exp-card__role-badges"
                      *ngIf="exp.tipoEmpleo || exp.esActual"
                    >
                      <span
                        class="badge-pf badge-pf--employment exp-card__meta-badge"
                        [ngClass]="getEmploymentBadgeClass(exp)"
                        *ngIf="exp.tipoEmpleo"
                      >
                        <i class="bi" [ngClass]="getEmploymentIcon(exp)" aria-hidden="true"></i>
                        {{ exp.tipoEmpleo.nombre }}
                      </span>
                      <span class="badge-pf badge-pf--actual" *ngIf="exp.esActual">Actual</span>
                    </div>

                    <p class="card-portfolio__text exp-card__text">{{ exp.descripcionE }}</p>
                  </div>

                  <aside class="exp-card__skills" *ngIf="exp.habilidades?.length">
                    <div class="exp-card__skills-head">Habilidades</div>
                    <div class="exp-card__skills-body">
                      <app-skill-chips [habilidades]="exp.habilidades"></app-skill-chips>
                    </div>
                  </aside>
                </div>

                <footer class="exp-card__footer" *ngIf="isAdmin">
                  <div class="exp-card__actions">
                    <button
                      class="btn-pf btn-pf--edit btn-pf--icon-sm"
                      type="button"
                      (click)="openForm('edit', exp.id)"
                      data-tip="Editar"
                      aria-label="Editar experiencia"
                    >
                      <i class="bi bi-pencil-square" aria-hidden="true"></i>
                    </button>
                    <button
                      class="btn-pf btn-pf--delete btn-pf--icon-sm"
                      type="button"
                      (click)="delete(exp.id)"
                      data-tip="Eliminar"
                      aria-label="Eliminar experiencia"
                    >
                      <i class="bi bi-trash" aria-hidden="true"></i>
                    </button>
                  </div>
                </footer>
              </div>
            </article>
          </div>
        </div>
      </div>

      <button
        type="button"
        class="exp-carousel__nav exp-carousel__nav--next"
        *ngIf="showNav"
        [disabled]="!canGoNext"
        (click)="nextPage()"
        aria-label="Experiencia siguiente"
      >
        <i class="bi bi-chevron-right" aria-hidden="true"></i>
      </button>
    </div>

    <div class="exp-carousel__footer" *ngIf="showNav">
      <p class="exp-carousel__counter" aria-live="polite">
        {{ currentPage + 1 }} / {{ totalPages }}
      </p>
      <div class="exp-carousel__dots" role="tablist" aria-label="Páginas del carrusel">
        <button
          type="button"
          class="exp-carousel__dot"
          *ngFor="let page of pages; let i = index"
          [class.exp-carousel__dot--active]="i === currentPage"
          [attr.aria-label]="'Ir a la página ' + (i + 1)"
          [attr.aria-selected]="i === currentPage"
          role="tab"
          (click)="goToPage(i)"
        ></button>
      </div>
    </div>
  </div>

  <div *ngIf="expe.length === 0" class="empty-state">
    No hay experiencias cargadas.
  </div>
</section>
