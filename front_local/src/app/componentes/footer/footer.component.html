<footer class="site-footer">
  <p>Ana Lucia Juarez | © Argentina Programa 2022</p>
  <p>Miramar, Buenos Aires, Argentina</p>

  <div class="footer-backup" *ngIf="isLogged">
    <div
      class="footer-backup__backdrop"
      *ngIf="menuOpen"
      aria-hidden="true"
      (click)="closeMenu()"
    ></div>

    <div class="footer-backup__panel" [class.footer-backup__panel--open]="menuOpen">
      <button
        type="button"
        class="footer-backup__action"
        (click)="exportar()"
        [disabled]="busy"
      >
        <i class="bi bi-download" aria-hidden="true"></i>
        <span>Exportar BD</span>
      </button>
      <button
        type="button"
        class="footer-backup__action"
        (click)="triggerImport()"
        [disabled]="busy"
      >
        <i class="bi bi-upload" aria-hidden="true"></i>
        <span>Importar BD</span>
      </button>
    </div>

    <button
      type="button"
      class="footer-backup__toggle btn-pf btn-pf--ghost"
      (click)="toggleMenu($event)"
      [disabled]="busy"
      [attr.aria-expanded]="menuOpen"
      aria-controls="footer-backup-menu"
      data-tip="Base de datos"
      data-tip-pos="left"
      aria-label="Opciones de base de datos"
    >
      <i
        class="bi"
        [ngClass]="busy ? 'bi-hourglass-split' : 'bi-hdd-stack'"
        aria-hidden="true"
      ></i>
    </button>

    <input
      #sqlInput
      type="file"
      accept=".sql,application/sql,text/plain"
      hidden
      (change)="onFileSelected($event)"
    />
  </div>
</footer>
