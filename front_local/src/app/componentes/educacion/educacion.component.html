<section id="educacion" class="section section--default">
  <div class="section__header">
    <h2 class="section__title">Educación</h2>
    <button
      type="button"
      class="btn-pf btn-pf--add"
      (click)="openForm('create')"
      *ngIf="isLogged"
      data-tip="Agregar educación"
      data-tip-align="end"
      aria-label="Agregar educación"
    >
      <i class="bi bi-plus-lg"></i>
    </button>
  </div>

  <div class="edu-filters" *ngIf="showFilters" role="radiogroup" aria-label="Filtrar por tipo de educación">
    <button
      type="button"
      class="edu-filter"
      [class.edu-filter--active]="selectedTipoId === null"
      role="radio"
      [attr.aria-checked]="selectedTipoId === null"
      (click)="selectFilter(null)"
    >
      Todas
    </button>
    <button
      type="button"
      class="edu-filter"
      *ngFor="let tipo of tiposEducacion"
      [class.edu-filter--active]="selectedTipoId === tipo.id"
      role="radio"
      [attr.aria-checked]="selectedTipoId === tipo.id"
      (click)="selectFilter(tipo.id)"
    >
      {{ tipo.nombre }}
    </button>
  </div>

  <div class="edu-carousel" *ngIf="filteredEducacion.length > 0">
    <div class="edu-carousel__wrapper">
      <button
        type="button"
        class="edu-carousel__nav edu-carousel__nav--prev"
        *ngIf="showNav"
        [disabled]="!canGoPrev"
        (click)="prevPage()"
        aria-label="Educación anterior"
      >
        <i class="bi bi-chevron-left" aria-hidden="true"></i>
      </button>

      <div
        #carousel
        class="edu-carousel__viewport"
        [style.height.px]="viewportHeight"
        tabindex="0"
        role="region"
        aria-label="Carrusel de educación"
        aria-live="polite"
      >
        <div
          class="edu-carousel__track"
          [style.--total-pages]="totalPages"
          [style.transform]="trackTransform"
        >
          <div
            #carouselPage
            class="edu-carousel__page"
            [class.edu-carousel__page--desktop]="isDesktop"
            *ngFor="let page of pages; let pageIndex = index"
            [attr.aria-hidden]="pageIndex !== currentPage"
          >
            <article
              class="card-portfolio edu-card"
              [ngClass]="getCardCategoryClass(edu)"
              *ngFor="let edu of page"
            >
              <div class="card-portfolio__body edu-card__body">
                <header class="edu-card__header">
                  <div class="edu-card__org" *ngIf="edu.organizacion">
                    <app-org-badge
                      [organizacion]="edu.organizacion"
                      size="md"
                    ></app-org-badge>
                  </div>

                  <div class="edu-card__meta-box" aria-label="Período y tipo">
                    <app-periodo-display
                      [fechaInicio]="edu.fechaInicio"
                      [fechaFin]="edu.fechaFin"
                      [esActual]="isEnCurso(edu)"
                    ></app-periodo-display>

                    <div
                      class="edu-card__type-badges"
                      *ngIf="edu.tipoEducacion || isEnCurso(edu)"
                    >
                      <span
                        class="badge-pf badge-pf--education edu-card__meta-badge"
                        [ngClass]="getEducationBadgeClass(edu)"
                        *ngIf="edu.tipoEducacion"
                      >
                        <i class="bi" [ngClass]="getEducationIcon(edu)" aria-hidden="true"></i>
                        {{ edu.tipoEducacion.nombre }}
                      </span>
                      <span class="badge-pf badge-pf--actual" *ngIf="isEnCurso(edu)">En curso</span>
                    </div>
                  </div>
                </header>

                <div
                  class="edu-card__main"
                  [class.edu-card__main--with-image]="!!edu.archivoImagen"
                  [class.edu-card__main--with-skills]="!!edu.habilidades?.length"
                >
                  <div class="edu-card__intro">
                    <h3 class="card-portfolio__title edu-card__title">{{ edu.nombreE }}</h3>
                  </div>

                  <button
                    type="button"
                    class="edu-card__image img-zoomable"
                    *ngIf="edu.archivoImagen"
                    (click)="openImageViewer(edu)"
                    [attr.aria-label]="'Ampliar imagen de ' + edu.nombreE"
                  >
                    <img
                      *ngIf="isUrl(edu.archivoImagen)"
                      [src]="edu.archivoImagen"
                      [alt]="edu.nombreE"
                      class="edu-cert-img"
                    />
                    <app-base64-image
                      *ngIf="!isUrl(edu.archivoImagen)"
                      [src]="edu.archivoImagen"
                      [alt]="edu.nombreE"
                      cssClass="edu-cert-img"
                      maxHeight="220px"
                    ></app-base64-image>
                    <span class="img-zoomable__hint" aria-hidden="true">
                      <i class="bi bi-zoom-in"></i>
                    </span>
                  </button>

                  <p class="card-portfolio__text edu-card__text">{{ edu.descripcionE }}</p>

                  <aside class="edu-card__skills" *ngIf="edu.habilidades?.length">
                    <div class="edu-card__skills-head">Habilidades</div>
                    <div class="edu-card__skills-body">
                      <app-skill-chips [habilidades]="edu.habilidades"></app-skill-chips>
                    </div>
                  </aside>
                </div>

                <footer class="edu-card__footer" *ngIf="showCardActions(edu)">
                  <div class="edu-card__actions">
                    <button
                      *ngIf="hasPdf(edu)"
                      type="button"
                      class="btn-pf btn-pf--view btn-pf--icon-sm"
                      (click)="openPdf(edu)"
                      data-tip="Ver certificado"
                      aria-label="Ver certificado"
                    >
                      <i class="bi bi-file-earmark-pdf" aria-hidden="true"></i>
                    </button>
                    <button
                      *ngIf="isLogged"
                      type="button"
                      class="btn-pf btn-pf--edit btn-pf--icon-sm"
                      (click)="openForm('edit', edu.id!)"
                      data-tip="Editar"
                      aria-label="Editar educación"
                    >
                      <i class="bi bi-pencil-square" aria-hidden="true"></i>
                    </button>
                    <button
                      *ngIf="isLogged"
                      type="button"
                      class="btn-pf btn-pf--delete btn-pf--icon-sm"
                      (click)="delete(edu.id)"
                      data-tip="Eliminar"
                      aria-label="Eliminar educación"
                    >
                      <i class="bi bi-trash" aria-hidden="true"></i>
                    </button>
                  </div>
                </footer>
              </div>
            </article>
          </div>
        </div>
      </div>

      <button
        type="button"
        class="edu-carousel__nav edu-carousel__nav--next"
        *ngIf="showNav"
        [disabled]="!canGoNext"
        (click)="nextPage()"
        aria-label="Educación siguiente"
      >
        <i class="bi bi-chevron-right" aria-hidden="true"></i>
      </button>
    </div>

    <div class="edu-carousel__footer" *ngIf="showNav">
      <p class="edu-carousel__counter" aria-live="polite">
        {{ currentPage + 1 }} / {{ totalPages }}
      </p>
      <div class="edu-carousel__dots" role="tablist" aria-label="Páginas del carrusel">
        <button
          type="button"
          class="edu-carousel__dot"
          *ngFor="let page of pages; let i = index"
          [class.edu-carousel__dot--active]="i === currentPage"
          [attr.aria-label]="'Ir a la página ' + (i + 1)"
          [attr.aria-selected]="i === currentPage"
          role="tab"
          (click)="goToPage(i)"
        ></button>
      </div>
    </div>
  </div>

  <div *ngIf="educacion.length === 0" class="empty-state">
    No hay educación cargada.
  </div>

  <div *ngIf="educacion.length > 0 && filteredEducacion.length === 0" class="empty-state">
    No hay educación para el filtro seleccionado.
  </div>

  <app-pdf-viewer-modal
    [open]="pdfViewerOpen"
    [src]="pdfViewerSrc"
    [title]="pdfViewerTitle"
    (closed)="closePdfViewer()"
  ></app-pdf-viewer-modal>

  <app-image-viewer-modal
    [open]="imageViewerOpen"
    [src]="imageViewerSrc"
    [title]="imageViewerTitle"
    (closed)="closeImageViewer()"
  ></app-image-viewer-modal>
</section>
